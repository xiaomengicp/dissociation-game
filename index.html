<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三天</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-normal: #fafaf8;
            --bg-stress: #f5f3ef;
            --bg-dissociation: #1a1a1a;
            --bg-autopilot: #f0f0ed;
            
            --text-normal: #2a2a2a;
            --text-muted: #6a6a6a;
            --text-faint: #9a9a9a;
            --text-dissociation: #e0e0e0;
            
            --accent: #8b7355;
            --danger: #a65d57;
            --safe: #5d7a6a;
            
            --transition-slow: 1.2s ease;
            --transition-normal: 0.4s ease;
        }
        
        body {
            font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            background-color: var(--bg-normal);
            color: var(--text-normal);
            min-height: 100vh;
            transition: background-color var(--transition-slow), color var(--transition-slow);
            line-height: 1.9;
            font-weight: 300;
        }
        
        body.stress {
            background-color: var(--bg-stress);
        }
        
        body.dissociation {
            background-color: var(--bg-dissociation);
            color: var(--text-dissociation);
        }
        
        body.autopilot {
            background-color: var(--bg-autopilot);
            color: var(--text-muted);
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header / Status */
        .header {
            margin-bottom: 60px;
            opacity: 0.7;
            font-size: 13px;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        
        .time-indicator {
            font-weight: 400;
        }
        
        .status-line {
            color: var(--text-muted);
            font-size: 12px;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .narrative {
            font-size: 17px;
            margin-bottom: 50px;
            line-height: 2.2;
        }
        
        .narrative p {
            margin-bottom: 1.5em;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }
        
        .narrative p:nth-child(1) { animation-delay: 0.2s; }
        .narrative p:nth-child(2) { animation-delay: 0.5s; }
        .narrative p:nth-child(3) { animation-delay: 0.8s; }
        .narrative p:nth-child(4) { animation-delay: 1.1s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Choices */
        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .choice {
            background: transparent;
            border: 1px solid var(--text-faint);
            padding: 16px 24px;
            font-family: inherit;
            font-size: 15px;
            color: inherit;
            cursor: pointer;
            transition: all var(--transition-normal);
            text-align: left;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
        
        .choice:nth-child(1) { animation-delay: 1.2s; }
        .choice:nth-child(2) { animation-delay: 1.35s; }
        .choice:nth-child(3) { animation-delay: 1.5s; }
        .choice:nth-child(4) { animation-delay: 1.65s; }
        .choice:nth-child(5) { animation-delay: 1.8s; }
        
        .choice:hover {
            border-color: var(--text-normal);
            padding-left: 30px;
        }
        
        .choice.prominent {
            border-width: 2px;
            font-weight: 400;
        }
        
        .choice.muted {
            opacity: 0.5;
            border-style: dashed;
        }
        
        .choice.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-style: dotted;
        }
        
        .choice.disabled:hover {
            padding-left: 24px;
            border-color: var(--text-faint);
        }
        
        /* Dissociation specific styles */
        body.dissociation .choice {
            border-color: rgba(255,255,255,0.2);
        }
        
        body.dissociation .choice:hover {
            border-color: rgba(255,255,255,0.5);
        }
        
        /* Fragments (dissociation state) */
        .fragments-container {
            position: relative;
            min-height: 300px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
        }
        
        .fragment {
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 16px;
            color: var(--text-dissociation);
            cursor: pointer;
            padding: 15px 25px;
            opacity: 0;
            animation: float 4s ease-in-out infinite, fragmentFadeIn 1s ease forwards;
            transition: all var(--transition-normal);
        }
        
        .fragment:nth-child(1) { animation-delay: 0.3s, 0s; }
        .fragment:nth-child(2) { animation-delay: 0.6s, 0.5s; }
        .fragment:nth-child(3) { animation-delay: 0.9s, 1s; }
        .fragment:nth-child(4) { animation-delay: 1.2s, 1.5s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes fragmentFadeIn {
            from { opacity: 0; }
            to { opacity: 0.7; }
        }
        
        .fragment:hover {
            opacity: 1;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        
        .fragment.anchor-fragment {
            color: #667;
        }
        
        .fragment.anchor-fragment:hover {
            color: #889;
        }
        
        .fragment.fading {
            animation: fragmentFadeOut 0.8s ease forwards;
        }
        
        @keyframes fragmentFadeOut {
            to { opacity: 0; transform: scale(0.9); }
        }
        
        /* Time display during dissociation */
        .time-passing {
            position: fixed;
            top: 30px;
            right: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.3);
            font-family: monospace;
        }
        
        /* Status cards */
        .status-cards {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .status-card {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background: rgba(0,0,0,0.02);
            border-left: 2px solid var(--text-faint);
        }
        
        .status-card-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        
        .status-card-value {
            font-size: 14px;
        }
        
        /* Warning hint */
        .warning-hint {
            font-size: 13px;
            color: var(--danger);
            opacity: 0.8;
            margin-top: 30px;
            font-style: italic;
        }
        
        /* Safe exit */
        .safe-exit {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 12px;
            color: var(--text-faint);
            text-decoration: none;
            padding: 10px 15px;
            border: 1px solid transparent;
            transition: all var(--transition-normal);
            cursor: pointer;
            background: none;
            font-family: inherit;
        }
        
        .safe-exit:hover {
            border-color: var(--text-faint);
        }
        
        body.dissociation .safe-exit {
            color: rgba(255,255,255,0.3);
        }
        
        /* Ending screen */
        .ending {
            text-align: center;
        }
        
        .ending h2 {
            font-weight: 400;
            font-size: 24px;
            margin-bottom: 30px;
        }
        
        .ending-summary {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 40px;
        }
        
        /* Autopilot visual effect */
        body.autopilot .narrative {
            opacity: 0.7;
        }
        
        body.autopilot .choice {
            letter-spacing: 0.5px;
        }
        
        /* Screen transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .screen.active {
            display: block;
            opacity: 1;
        }
        
        /* Title screen */
        .title-screen {
            text-align: center;
            padding-top: 30vh;
        }
        
        .title-screen h1 {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 10px;
        }
        
        .title-screen .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 60px;
        }
        
        .title-screen .start-btn {
            background: none;
            border: 1px solid var(--text-normal);
            padding: 15px 40px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        
        .title-screen .start-btn:hover {
            background: var(--text-normal);
            color: var(--bg-normal);
        }
        
        /* Safe exit overlay */
        .safe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(250,250,248,0.98);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .safe-overlay.active {
            display: flex;
        }
        
        .safe-content {
            max-width: 400px;
            text-align: center;
            padding: 40px;
        }
        
        .safe-content p {
            margin-bottom: 20px;
            line-height: 2;
        }
        
        .safe-content .return-btn {
            margin-top: 30px;
            background: none;
            border: 1px solid var(--text-normal);
            padding: 12px 30px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        
        .safe-content .return-btn:hover {
            background: var(--text-normal);
            color: var(--bg-normal);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Title Screen -->
        <div class="screen title-screen active" id="title-screen">
            <h1>三天</h1>
            <p class="subtitle">一个关于撑过去的游戏</p>
            <button class="start-btn" onclick="startGame()">开始</button>
        </div>
        
        <!-- Game Screen -->
        <div class="screen" id="game-screen">
            <div class="header">
                <span class="time-indicator" id="time-indicator">周一 · 早上</span>
                <span class="status-line" id="status-line"></span>
            </div>
            
            <div class="main-content">
                <div class="status-cards" id="status-cards"></div>
                <div class="narrative" id="narrative"></div>
                <div class="choices" id="choices"></div>
                <div class="warning-hint" id="warning-hint"></div>
            </div>
        </div>
        
        <!-- Dissociation Screen -->
        <div class="screen" id="dissociation-screen">
            <div class="time-passing" id="time-passing"></div>
            <div class="main-content">
                <div class="narrative" id="dissociation-narrative"></div>
                <div class="fragments-container" id="fragments"></div>
                <div class="choices" id="dissociation-choices"></div>
            </div>
        </div>
        
        <!-- Ending Screen -->
        <div class="screen ending" id="ending-screen">
            <div class="main-content">
                <h2 id="ending-title"></h2>
                <div class="ending-summary" id="ending-summary"></div>
                <button class="choice" onclick="location.reload()">再来一次</button>
            </div>
        </div>
    </div>
    
    <!-- Safe Exit Button -->
    <button class="safe-exit" id="safe-exit" onclick="showSafeExit()">暂停</button>
    
    <!-- Safe Exit Overlay -->
    <div class="safe-overlay" id="safe-overlay">
        <div class="safe-content">
            <p>你可以暂停。</p>
            <p>你不需要证明你能撑。</p>
            <p style="color: var(--text-muted); font-size: 14px;">
                如果你愿意：<br>
                看看你身边的三个物体<br>
                感觉脚底接触地面<br>
                吸气，呼气
            </p>
            <p>你可以随时回来继续玩。</p>
            <button class="return-btn" onclick="hideSafeExit()">返回游戏</button>
        </div>
    </div>

    <script>
        // ============================================
        // GAME STATE
        // ============================================
        const state = {
            // Time
            day: 1,
            timeSlot: 0, // 0=早上, 1=下午, 2=晚上
            
            // 恢复合理的初始数值
            energy: 7,
            stress: 2,
            dissociationThreshold: 7,
            
            // Progress lines
            workProgress: 0,
            workRequired: 3,
            relationshipStatus: 1, // 从"有点疏远"开始
            relationshipNeglect: 0, // 给玩家至少一个回合的工作机会
            familyPressure: 0,
            familyIgnored: 0,
            
            // 锚点需要通过行动获得
            anchors: {
                breath: { strength: 0, cooldown: 0, name: '呼吸练习' },
                person: { strength: 0, cooldown: 0, name: '重要的人' },
                place: { strength: 0, cooldown: 0, name: '安全的地方' }
            },
            
            // States
            inDissociation: false,
            autopilotMode: false,
            dissociationCount: 0,
            consecutiveAvoid: 0,
            
            // Dissociation
            dissociationDepth: 0,
            timePassedInDissociation: 0,
            lastStressSource: null
        };
        
        const DAYS = ['周一', '周二', '周三'];
        const TIME_SLOTS = ['早上', '下午', '晚上'];
        
        // ============================================
        // NARRATIVE CONTENT
        // ============================================
        
        const dayIntros = {
            1: {
                0: {
                    text: () => `<p>新的一周。</p>
                           <p>你醒来，看了一眼手机。有几条消息，一个工作提醒。</p>
                           <p>周三有个东西要交。还有时间。</p>`,
                    statusUpdate: true
                },
                1: {
                    text: () => {
                        let t = `<p>下午了。</p>
                               <p>时间在走。${state.workProgress === 0 ? '工作的事还没动。' : ''}</p>`;
                        // 呼吸引导：压力高时提示
                        if (state.stress >= 5) {
                            t += `<p style="opacity: 0.7;">你觉得胸口有点闷。也许需要调整一下呼吸。</p>`;
                        }
                        // 家庭压力即时反馈
                        if (state.familyPressure >= 2) {
                            t += `<p style="opacity: 0.7;">手机屏幕亮了一下，又是家里的未接来电。</p>`;
                        }
                        return t;
                    }
                },
                2: {
                    text: () => {
                        let t = `<p>晚上。</p>
                               <p>一天快结束了。还有两天。</p>`;
                        if (state.familyPressure >= 2) {
                            t += `<p style="opacity: 0.7;">手机上的未接来电还在那里。你没有力气回。</p>`;
                        }
                        return t;
                    }
                }
            },
            2: {
                0: {
                    text: () => {
                        // Day2开始有家庭压力
                        if (state.familyPressure === 0) state.familyPressure = 1;
                        let t = `<p>周二。</p>
                               <p>昨天的事好像很远了。</p>
                               <p>${state.workProgress === 0 ? '工作的事还没开始。' : `工作进度：${state.workProgress}/${state.workRequired}。`}</p>`;
                        if (state.familyPressure >= 1) {
                            t += `<p style="opacity: 0.7;">家人昨晚打过电话。你没接。</p>`;
                        }
                        return t;
                    }
                },
                1: {
                    text: () => {
                        let t = `<p>下午。</p>
                               <p>手机震了一下。可能是TA的消息，也可能是工作的催促。</p>`;
                        if (state.familyPressure >= 2) {
                            t += `<p style="opacity: 0.7;">又是家里的来电。你看了一眼，放下了。</p>`;
                        }
                        return t;
                    }
                },
                2: {
                    text: () => {
                        let t = `<p>晚上了。</p>
                               <p>明天就是周三。截止日。</p>`;
                        if (state.familyPressure >= 2) {
                            t += `<p style="opacity: 0.7;">未接来电：${state.familyPressure}通。你知道拖不了多久。</p>`;
                        }
                        return t;
                    }
                }
            },
            3: {
                0: {
                    text: () => {
                        let t = `<p>周三。</p>
                               <p>就是今天。</p>
                               <p>${state.workProgress < state.workRequired ? `工作进度：${state.workProgress}/${state.workRequired}。还差${state.workRequired - state.workProgress}个单位。` : '工作做完了。至少这个不用担心。'}</p>`;
                        if (state.familyPressure >= 3) {
                            t += `<p style="opacity: 0.7;">家人已经打了${state.familyPressure}通电话。你知道今天必须回。</p>`;
                        }
                        return t;
                    }
                },
                1: {
                    text: () => {
                        let t = `<p>下午。</p>
                               <p>${state.workProgress < state.workRequired ? '时间在收紧。' : '工作交了。松了一口气。'}</p>`;
                        if (state.familyPressure >= 2) {
                            t += `<p style="opacity: 0.7;">手机又亮了。家人。</p>`;
                        }
                        return t;
                    }
                },
                2: {
                    text: () => {
                        let t = `<p>晚上。</p>
                               <p>快结束了。</p>`;
                        if (state.familyPressure >= 2) {
                            t += `<p style="opacity: 0.7;">那些未接来电还在。</p>`;
                        }
                        return t;
                    }
                }
            }
        };
        
        // Energy descriptions
        function getEnergyText() {
            if (state.energy <= 2) return '你很累。每个动作都很重。';
            if (state.energy <= 4) return '有点累。';
            if (state.energy <= 6) return '还行。';
            return '精力还不错。';
        }
        
        // Stress warning (only when close to threshold)
        function getStressWarning() {
            if (state.stress >= state.dissociationThreshold - 1) {
                const warnings = [
                    '你感觉有什么不太对。',
                    '你的呼吸变浅了。',
                    '好像有什么在累积。'
                ];
                return warnings[Math.floor(Math.random() * warnings.length)];
            }
            return '';
        }
        
        // Work status text - 显示具体进度
        function getWorkStatusText() {
            const remaining = state.workRequired - state.workProgress;
            if (state.day === 3 && remaining > 0) {
                if (remaining >= 2) return `来不及了。还差${remaining}个单位。这个念头一直在。`;
                return `最后一点了。还差${remaining}个单位。`;
            }
            if (state.workProgress === 0) return `还没开始。需要完成${state.workRequired}个单位。`;
            if (remaining > 0) return `进度：${state.workProgress}/${state.workRequired}。还差${remaining}个单位。`;
            return '做完了。至少这个可以放下。';
        }
        
        // Relationship status text - 更细致的状态
        function getRelationshipStatusText() {
            if (state.relationshipStatus === 0) {
                return 'TA的消息变短了。最后一条只有"好"。';
            }
            if (state.relationshipStatus === 1) {
                if (state.relationshipNeglect >= 2) {
                    return `你们已经${state.relationshipNeglect}条消息没好好聊了。`;
                }
                return '你们好像有一阵子没好好说话了。';
            }
            return 'TA最近的消息让你觉得被接住。';
        }
        
        // Family status text - 更具体的压力
        function getFamilyStatusText() {
            if (state.familyPressure === 0) return '家里最近没什么动静。';
            if (state.familyPressure === 1) return '父母那边有些事。你知道迟早要处理。';
            if (state.familyPressure === 2) return '未接来电：2通。你知道不回会更麻烦。';
            return `未接来电：${state.familyPressure}通。每次看到都心跳加速。`;
        }
        
        // ============================================
        // ACTIONS
        // ============================================
        
        const actions = {
            work: {
                label: () => {
                    const remaining = state.workRequired - state.workProgress;
                    if (remaining <= 0) return '工作（已完成）';
                    return `做工作（还差${remaining}个单位）`;
                },
                energy: -2,
                stress: 2,
                effect: () => { 
                    state.workProgress++; 
                    state.lastStressSource = 'work';
                    const remaining = state.workRequired - state.workProgress;
                    
                    // === 方案二：工作会冷落伴侣 ===
                    state.relationshipNeglect++;
                    let extraText = '';
                    if (state.relationshipNeglect >= 2 && state.relationshipStatus > 0) {
                        state.relationshipStatus--;
                        extraText = ' TA发来消息，你没来得及回。';
                    }
                    
                    if (state.workProgress === 1) {
                        return `你坐下来，试着集中注意力。很难。但你开始了。进度：1/${state.workRequired}。${extraText}`;
                    }
                    if (remaining === 0) {
                        return '你终于做完了。可以放下了。' + extraText;
                    }
                    return `又做了一点。进度：${state.workProgress}/${state.workRequired}。${extraText}`;
                },
                available: () => state.energy >= 2 && state.workProgress < state.workRequired
            },
            seePartner: {
                label: () => {
                    if (state.relationshipStatus === 0) return '回TA的消息';
                    if (state.relationshipStatus === 1) return '回TA的消息';
                    return '见TA';
                },
                energy: -1,
                stress: () => {
                    // 高压力时见面反而增加压力（会吵架）
                    if (state.stress > 6) return 2;
                    if (state.relationshipStatus >= 2) return -1;
                    return Math.random() > 0.5 ? -1 : 1;
                },
                effect: () => {
                    state.lastStressSource = 'relationship';
                    
                    // === 方案一：高压下的冲突逻辑 ===
                    if (state.stress > 6 || state.dissociationCount > 1) {
                        state.relationshipStatus = Math.max(0, state.relationshipStatus - 1);
                        state.relationshipNeglect++;
                        return '你想寻求安慰，但你太烦躁了。你们吵了几句。TA最后没说话，关上了门。你感觉更糟了。';
                    }
                    
                    state.relationshipNeglect = 0;
                    
                    if (state.relationshipStatus === 0) {
                        if (Math.random() > 0.5) {
                            state.relationshipStatus = 1;

            const totalWeight = available.reduce((sum, [key, event]) => {
                return sum + (typeof event.weight === 'function' ? event.weight(day) : event.weight || 1);
            }, 0);
            
            let random = Math.random() * totalWeight;
            for (const [key, event] of available) {
                const weight = typeof event.weight === 'function' ? event.weight(day) : event.weight || 1;
                random -= weight;
                if (random <= 0) return { key, ...event };
            }
            
            return { key: 'peaceful', ...events.peaceful };

                const btn = document.createElement('button');
                btn.className = 'choice';
                btn.textContent = typeof choice.label === 'function' ? choice.label() : choice.label;
                
                if (choice.prominent && (typeof choice.prominent === 'function' ? choice.prominent() : choice.prominent)) {
                    btn.classList.add('prominent');
                }
                
                if (choice.available !== undefined && !choice.available()) {
                    btn.classList.add('disabled');
                    btn.title = '你太累了';
                } else {
                    btn.onclick = choice.action;
                }
                
                container.appendChild(btn);
            });
        }
        
        // ============================================
        // GAME FLOW
        // ============================================
        
        function startGame() {
            document.getElementById('safe-exit').style.display = 'block';
            showScreen('game-screen');
            
            // 故事背景介绍
            renderNarrative(`
                <p>周一早上。</p>
                <p>你有一份工作要在周三交。你有一个关系需要维护。你有一个家庭偶尔会打电话来。</p>
                <p>三天。</p>
                <p>你只需要撑过这三天。</p>
            `);
            
            renderChoices([
                { label: '开始', action: startTimeSlot }
            ]);
        }
        
        function startTimeSlot() {
            // 减少锚点冷却
            Object.values(state.anchors).forEach(a => {
                if (a.cooldown > 0) a.cooldown--;
            });
            
            // 每天早上恢复一些能量
            if (state.timeSlot === 0 && state.day > 1) {
                state.energy = Math.min(10, state.energy + 3);
            }
            
            // 限制数值范围
            state.stress = Math.max(0, Math.min(10, state.stress));
            state.energy = Math.max(0, Math.min(10, state.energy));
            
            // 1. 先计算当天的剧情文本（这里面包含了 Day 2 增加家庭压力的逻辑）
            const intro = dayIntros[state.day][state.timeSlot];
            const introText = typeof intro.text === 'function' ? intro.text() : intro.text;
            
            // 2. 状态更新后再渲染界面
            renderGameScreen();
            renderNarrative(introText);
            
            // 构建行动选项
            const choices = Object.entries(actions)
                .filter(([key, action]) => {
                    if (key === 'family' && state.familyPressure === 0) return false;
                    if (key === 'work' && state.workProgress >= state.workRequired) return false;
                    return true;
                })
                .map(([key, action]) => ({
                    label: typeof action.label === 'function' ? action.label() : action.label,
                    available: action.available,
                    prominent: action.prominent,
                    action: () => doAction(key)
                }));
            
            renderChoices(choices);
        }
        
        function doAction(actionKey) {
            const action = actions[actionKey];
            
            // Apply effects
            state.energy += action.energy;
            const stressChange = typeof action.stress === 'function' ? action.stress() : action.stress;
            state.stress += stressChange;
            
            // Clamp values
            state.energy = Math.max(0, Math.min(10, state.energy));
            state.stress = Math.max(0, Math.min(10, state.stress));
            
            // Reset consecutive avoid if not avoiding
            if (actionKey !== 'avoid') {
                state.consecutiveAvoid = 0;
            }
            
            // Get action result text
            const resultText = action.effect();
            
            // 解离触发：压力到阈值 + 随机掷骰
            // 不是100%触发，给玩家喘息空间
            let triggerChance = 0;
            if (state.stress >= state.dissociationThreshold) {
                triggerChance = 0.6; // 60%几率触发
                if (state.energy <= 3) triggerChance += 0.2; // 能量低时更容易
                if (state.stress >= 9) triggerChance += 0.2; // 压力极高时更容易
            }
            
            if (Math.random() < triggerChance) {
                setTimeout(() => enterDissociation(), 1500);
                renderNarrative(`<p>${resultText}</p>`);
                document.getElementById('choices').innerHTML = '';
                return;
            }
            
            // Otherwise, show result and maybe event
            showActionResult(resultText);
        }
        
        function showActionResult(resultText) {
            renderGameScreen();
            renderNarrative(`<p>${resultText}</p>`);
            
            // 事件触发几率提高到70%
            if (Math.random() > 0.3) {
                setTimeout(() => triggerEvent(), 1200);
            } else {
                renderChoices([{ label: '继续', action: advanceTime }]);
            }
        }
        
        function triggerEvent() {
            const event = getRandomEvent();
            const eventText = typeof event.text === 'function' ? event.text() : event.text;
            
            renderNarrative(`<p>${eventText}</p>`);
            
            if (event.choices) {
                const choices = event.choices.map(c => ({
                    label: c.label,
                    action: () => {
                        c.effect();
                        state.stress = Math.max(0, Math.min(10, state.stress));
                        state.energy = Math.max(0, Math.min(10, state.energy));
                        
                        // 解离触发也加随机性
                        let triggerChance = 0;
                        if (state.stress >= state.dissociationThreshold) {
                            triggerChance = 0.6;
                            if (state.energy <= 3) triggerChance += 0.2;
                        }
                        
                        if (Math.random() < triggerChance) {
                            setTimeout(() => enterDissociation(), 800);
                            document.getElementById('choices').innerHTML = '';
                        } else {
                            renderGameScreen();
                            renderChoices([{ label: '继续', action: advanceTime }]);
                        }
                    }
                }));
                renderChoices(choices);
            } else {
                if (event.effect) event.effect();
                state.stress = Math.max(0, Math.min(10, state.stress));
                state.energy = Math.max(0, Math.min(10, state.energy));
                
                // 解离触发也加随机性
                let triggerChance = 0;
                if (state.stress >= state.dissociationThreshold) {
                    triggerChance = 0.6;
                    if (state.energy <= 3) triggerChance += 0.2;
                }
                
                if (Math.random() < triggerChance) {
                    setTimeout(() => enterDissociation(), 1200);
                    document.getElementById('choices').innerHTML = '';
                } else {
                    renderGameScreen();
                    renderChoices([{ label: '继续', action: advanceTime }]);
                }
            }
        }
        
        function advanceTime() {
            state.timeSlot++;
            
            // === 方案二：家庭压力被动增长 ===
            // 每天下午和晚上，如果有未处理的家庭事宜，压力自动增加
            if (state.day >= 2 && state.familyPressure > 0) {
                if (Math.random() < 0.3) {
                    state.familyPressure++;
                }
            }
            
            if (state.timeSlot >= 3) {
                state.timeSlot = 0;
                state.day++;
                
                if (state.day > 3) {
                    showEnding();
                    return;
                }
            }
            
            startTimeSlot();
        }
        
        // ============================================
        // DISSOCIATION FLOW
        // ============================================
        
        function enterDissociation() {
            state.inDissociation = true;
            state.dissociationCount++;
            state.dissociationDepth = 0;
            state.timePassedInDissociation = 0;
            
            showScreen('dissociation-screen');
            updateBodyState();
            
            // 入口文案
            document.getElementById('dissociation-narrative').innerHTML = `
                <p>你的视线变得很窄。</p>
                <p>房间没有变，但你和房间之间隔了一层薄膜。</p>
                <p>你想做点什么——但"做"这件事突然离你很远。</p>
                <p style="margin-top: 2em; opacity: 0.5;">时间在走。你不在。</p>
            `;
            
            document.getElementById('fragments').innerHTML = '';
            
            renderDissociationChoices([
                { label: '继续', action: showDissociationFragments },
                { label: '暂停 / 回到呼吸', action: showSafeExit }
            ]);
            
            startTimePassingDisplay();
        }
        
        function showDissociationFragments() {
            state.dissociationDepth++;
            state.timePassedInDissociation++;
            
            const container = document.getElementById('fragments');
            container.innerHTML = '';
            
            document.getElementById('dissociation-narrative').innerHTML = `
                <p style="opacity: 0.6;">你看到一些词。</p>
                <p style="opacity: 0.4; margin-top: 1em;">点击文字...</p>
            `;
            
            // 干扰词
            const noiseWords = ['嗡嗡声', '空白', '这是哪', '我不在这', '好远', '像隔着玻璃', '断裂', '沉下去', '太远了', '回不去', '时间被偷走', '手指发冷', '胸口发紧', '耳鸣', '麻', '不知道'];
            
            // 根据深度增加干扰词数量
            const noiseCount = 5 + state.dissociationDepth * 2;
            
            // 收集所有要显示的词
            const allWords = [];
            
            // 添加干扰词
            for (let i = 0; i < noiseCount; i++) {
                const word = noiseWords[Math.floor(Math.random() * noiseWords.length)];
                allWords.push({ text: word, isAnchor: false });
            }
            
            // 锚点 - 只有获得了才出现，视觉上不明显
            const availableAnchors = [];
            if (state.anchors.breath.strength > 0 && state.anchors.breath.cooldown <= 1) {
                availableAnchors.push({ key: 'breath', name: '呼吸' });
            }
            if (state.anchors.person.strength > 0 && state.anchors.person.cooldown <= 1) {
                availableAnchors.push({ key: 'person', name: 'TA的声音' });
            }
            if (state.anchors.place.strength > 0 && state.anchors.place.cooldown <= 1) {
                availableAnchors.push({ key: 'place', name: '那个角落' });
            }
            
            // 如果有可用锚点，混入词堆里（不明显区分）
            if (availableAnchors.length > 0) {
                const anchorsToShow = Math.min(2, availableAnchors.length);
                for (let i = 0; i < anchorsToShow; i++) {
                    const anchor = availableAnchors[i];
                    allWords.push({ text: anchor.name, isAnchor: true, key: anchor.key });
                }
            }
            
            // 打乱顺序
            allWords.sort(() => Math.random() - 0.5);
            
            // 生成元素，位置更随机
            allWords.forEach((item, i) => {
                const el = document.createElement('button');
                el.className = 'fragment';
                el.textContent = item.text;
                
                // 更随机的位置
                el.style.left = (Math.random() * 70 + 10) + '%';
                el.style.top = (Math.random() * 60 + 15) + '%';
                el.style.fontSize = (Math.random() * 0.6 + 0.85) + 'em';
                el.style.opacity = (Math.random() * 0.3 + 0.5);
                el.style.transform = `rotate(${(Math.random() - 0.5) * 10}deg)`;
                el.style.animationDelay = `${i * 0.15}s`;
                
                if (item.isAnchor) {
                    // 锚点只有很微妙的视觉差异
                    el.classList.add('anchor-fragment');
                    el.onclick = () => foundAnchor(item.key);
                } else {
                    el.onclick = () => goDeeper();
                }
                
                container.appendChild(el);
            });
            
            document.getElementById('dissociation-choices').innerHTML = '';
        }
        
        function goDeeper() {
            state.dissociationDepth++;
            state.timePassedInDissociation++;
            
            // 视觉变深
            const overlay = document.getElementById('dissociation-screen');
            overlay.style.opacity = Math.max(0.7, 1 - state.dissociationDepth * 0.08);
            
            // 检查是否有可用锚点
            const hasAnchor = Object.values(state.anchors).some(a => a.strength > 0 && a.cooldown <= 1);
            
            if (state.dissociationDepth >= 4 && !hasAnchor) {
                // 没有锚点，太深了，只能等
                document.getElementById('fragments').innerHTML = '';
                document.getElementById('dissociation-narrative').innerHTML = `
                    <p>太深了。</p>
                    <p>你找不到任何能抓住的东西。</p>
                    <p>只能等。</p>
                `;
                renderDissociationChoices([
                    { label: '等', action: waitAndReturn }
                ]);
            } else if (state.dissociationDepth >= 6) {
                // 即使有锚点，太深了也只能等
                document.getElementById('fragments').innerHTML = '';
                document.getElementById('dissociation-narrative').innerHTML = `
                    <p>太深了。</p>
                    <p>那些能抓住的东西也变得很远。</p>
                    <p>只能等。</p>
                `;
                renderDissociationChoices([
                    { label: '等', action: waitAndReturn }
                ]);
            } else {
                showDissociationFragments();
            }
        }
        
        function foundAnchor(anchorKey) {
            const anchor = state.anchors[anchorKey];
            anchor.cooldown = 2; // 使用后进入冷却
            
            let text = '';
            switch(anchorKey) {
                case 'breath':
                    text = `<p>你专注于呼吸。</p>
                            <p>吸气。呼气。</p>
                            <p>世界稍微清晰了一点。</p>`;
                    break;
                case 'person':
                    text = `<p>你想起TA。</p>
                            <p>TA的声音，TA的样子。</p>
                            <p>有一瞬间，你觉得自己不是一个人。</p>`;
                    break;
                case 'place':
                    text = `<p>你想起那个安静的角落。</p>
                            <p>光线，温度，安全感。</p>
                            <p>你慢慢回到那里。</p>`;
                    break;
            }
            
            document.getElementById('fragments').innerHTML = '';
            document.getElementById('dissociation-narrative').innerHTML = text;
            
            renderDissociationChoices([
                { label: '回来', action: () => exitDissociation(false) }
            ]);
        }
        
        function waitAndReturn() {
            state.timePassedInDissociation += 2;
            
            document.getElementById('dissociation-narrative').innerHTML = `
                <p>你等着。</p>
                <p>不知道等什么。</p>
                <p>慢慢地，有什么在松动。</p>
                <p>不是因为你做了什么。只是——够久了。</p>
            `;
            
            renderDissociationChoices([
                { label: '回来', action: () => exitDissociation(false) }
            ]);
        }
        
        function exitDissociation(isAutopilot) {
            state.inDissociation = false;
            state.energy = Math.max(0, state.energy - 1);
            
            // 防止死循环：压力重置为阈值-2，给玩家1-2回合安全操作时间
            state.stress = Math.min(state.stress, state.dissociationThreshold - 2);
            
            // 恢复视觉
            document.getElementById('dissociation-screen').style.opacity = 1;
            
            // 手动推进时间（不调用advanceTime避免重复）
            state.timeSlot++;
            if (state.timeSlot >= 3) {
                state.timeSlot = 0;
                state.day++;
            }
            
            showScreen('game-screen');
            updateBodyState();
            renderGameScreen();
            
            // 后果文案
            let returnText = '<p>你回来了。</p>';
            returnText += '<p>你第一件事不是"反省"。</p>';
            returnText += '<p>而是：你发现世界已经走了一段。</p>';
            
            // 具体后果
            const consequences = getConsequences();
            if (consequences.length > 0) {
                returnText += '<p style="margin-top: 1.5em; opacity: 0.7;">' + 
                    consequences.join('</p><p style="opacity: 0.7;">') + '</p>';
            }
            
            renderNarrative(returnText);
            
            if (state.day > 3) {
                renderChoices([{ label: '继续', action: showEnding }]);
            } else {
                renderChoices([{ label: '继续', action: startTimeSlot }]);
            }
        }
        
        function getConsequences() {
            const consequences = [];
            const pool = [];
            
            // 关系后果
            if (state.relationshipStatus >= 1) {
                pool.push('你看到手机上有一条未读："我有点担心。明天跟我说一声就好。"');
                pool.push('聊天窗口停在你最后一句话后面。像一个没合上的门。');
            }
            
            // 工作后果
            if (state.workProgress < state.workRequired) {
                pool.push('文档还开着，但你不记得刚才写到哪一段。');
                pool.push(`屏幕右下角：距离截止还有 ${(3 - state.day) * 24 + (3 - state.timeSlot) * 8} 小时。`);
            }
            
            // 家庭后果
            if (state.familyPressure > 0) {
                pool.push('未接来电：家人。你看到那个名字的时候，喉咙先紧了一下。');
            }
            
            // 通用后果
            pool.push('厨房有一点焦味。不是很重，但足够让你知道：你不在的时候发生过什么。');
            pool.push('你发现自己坐在一个你不记得怎么到的地方——房间里，灯一直亮着。');
            pool.push('窗外的光线变了。你不知道过了多久。');
            pool.push('茶凉了。你不记得什么时候泡的。');
            
            // 随机选1-2个
            const count = Math.random() > 0.5 ? 2 : 1;
            for (let i = 0; i < count && pool.length > 0; i++) {
                const idx = Math.floor(Math.random() * pool.length);
                consequences.push(pool.splice(idx, 1)[0]);
            }
            
            return consequences;
        }
        
        function startTimePassingDisplay() {
            const display = document.getElementById('time-passing');
            let minutes = 0;
            
            const interval = setInterval(() => {
                if (!state.inDissociation) {
                    clearInterval(interval);
                    display.textContent = '';
                    return;
                }
                minutes += Math.floor(Math.random() * 10) + 5;
                display.textContent = `${minutes} 分钟过去了...`;
            }, 1500); // 更快：1.5秒
        }
        
        function renderDissociationChoices(choices) {
            const container = document.getElementById('dissociation-choices');
            container.innerHTML = '';
            
            choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice';
                btn.textContent = choice.label;
                btn.style.animationDelay = `${0.8 + index * 0.15}s`;
                
                if (choice.prominent) btn.classList.add('prominent');
                btn.onclick = choice.action;
                
                container.appendChild(btn);
            });
        }
        
        // ============================================
        // ENDING
        // ============================================
        
        function showEnding() {
            showScreen('ending-screen');
            document.body.className = '';
            
            let title, summary;
            
            const workDone = state.workProgress >= state.workRequired;
            const relationshipOk = state.relationshipStatus >= 1;
            const relationshipGood = state.relationshipStatus >= 2;
            const manyDissociations = state.dissociationCount >= 3;
            const someDissociations = state.dissociationCount >= 1;
            
            // 根据状态组合判断结局
            if (manyDissociations && state.energy <= 2) {
                title = '这三天像一场漫长的水下呼吸';
                summary = '你撑过来了。不是因为容易。是因为你一直在试着回来。';
            } else if (workDone && relationshipGood && !manyDissociations) {
                title = '你做到了';
                summary = '工作交了。TA还在。你还在。不是因为你正常，是因为你够努力。';
            } else if (workDone && relationshipGood) {
                title = '你做到了，但很累';
                summary = '工作交了。TA还在。但你知道这有多难。';
            } else if (workDone && !relationshipOk) {
                title = '交了';
                summary = '工作完成了。但有些东西在这三天里断了。你不确定能不能修。';
            } else if (!workDone && relationshipGood) {
                title = '至少TA还在';
                summary = '工作没交完。后果还不知道。但你知道你不是一个人。';
            } else if (!workDone && relationshipOk) {
                title = '撑过来了';
                summary = '工作没交完。关系勉强还在。你活过来了。别的以后再说。';
            } else if (state.relationshipStatus === 0) {
                title = '有些东西断了';
                summary = 'TA的消息停了。工作的事也乱了。但你还在这里。这本身就是一件事。';
            } else if (manyDissociations) {
                title = '你一直在回来';
                summary = `这三天，你解离了${state.dissociationCount}次。每一次你都试着回来。这就是你做的事。`;
            } else {
                title = '你活过来了';
                summary = '不是最好的三天。但你在这里。这就够了。';
            }
            
            // 统计信息
            let stats = [];
            stats.push(`解离了 ${state.dissociationCount} 次`);
            if (workDone) {
                stats.push('工作完成了');
            } else {
                stats.push(`工作进度：${state.workProgress}/${state.workRequired}`);
            }
            if (relationshipGood) {
                stats.push('和TA的关系还不错');
            } else if (relationshipOk) {
                stats.push('和TA的关系有点疏远');
            } else {
                stats.push('和TA的关系变冷了');
            }
            if (state.anchors.breath.strength >= 2) stats.push('呼吸练习变得更熟悉了');
            if (state.anchors.person.strength >= 2) stats.push('你和TA之间有了可以抓住的东西');
            if (state.anchors.place.strength >= 1) stats.push('你找到了一个安全的地方');
            if (state.autopilotMode) stats.push('你启动过自动驾驶模式');
            
            document.getElementById('ending-title').textContent = title;
            document.getElementById('ending-summary').innerHTML = `
                <p>${summary}</p>
                <p style="margin-top: 20px; font-size: 13px; opacity: 0.6;">
                    ${stats.join('<br>')}
                </p>
            `;
        }
        
        // ============================================
        // SAFE EXIT
        // ============================================
        
        function showSafeExit() {
            document.getElementById('safe-overlay').classList.add('active');
        }
        
        function hideSafeExit() {
            document.getElementById('safe-overlay').classList.remove('active');
        }
        
        // ============================================
        // INIT
        // ============================================
        
        // Hide safe exit on title screen
        document.getElementById('safe-exit').style.display = 'none';
    </script>
</body>
</html>
